<script>
if (POAuth.session()) location.replace('Dashboard/dashboard.html');
function showErr(m){const e=document.getElementById('err');e.textContent=m;e.classList.add('show');}
function togglePw(btn){const i=btn.parentElement.querySelector('input');i.type=i.type==='password'?'text':'password';btn.setAttribute('aria-label',i.type==='password'?'Show password':'Hide password');}
document.getElementById('loginForm').onsubmit = async e => {
  e.preventDefault();
  await POSeed.ready;
  const r = await POAuth.login(document.getElementById('username').value, document.getElementById('password').value);
  if (r.ok) location.href = 'Dashboard/dashboard.html'; else showErr(r.error);
};
</script>
